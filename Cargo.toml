[package]
name = "robotgirl"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tower-http = { version = "0.5", features = ["fs"] }
minijinja = "2.19.0"
lazy_static = "1.5.0"
textwrap = { version = "0.16.2", features = ["terminal_size"], default-features = false }
