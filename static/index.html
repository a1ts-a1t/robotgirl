<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobotGirl UI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        #chat-container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #messages { height: 400px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; background-color: #e9e9e9; border-radius: 4px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 4px; }
        .user-message { text-align: right; background-color: #dcf8c6; margin-left: 20%; }
        .robot-message { text-align: left; background-color: #ffffff; margin-right: 20%; border: 1px solid #ddd; }
        #input-area { display: flex; }
        #user-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; }
        #send-button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 0 4px 4px 0; }
        #send-button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h1>🤖 RobotGirl Conversation Interface</h1>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your message here...">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const sessionId = crypto.randomUUID();

        const API_ENDPOINT = '/api/chat'; 

        function appendMessage(sender, text) {
            const msgElement = document.createElement('div');
            msgElement.classList.add('message');
            msgElement.classList.add(sender === 'user' ? 'user-message' : 'robot-message');
            msgElement.textContent = text;
            messagesDiv.appendChild(msgElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll to bottom
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            // 1. Display user message
            appendMessage('user', message);
            userInput.value = '';
            sendButton.disabled = true;
            userInput.disabled = true;

            try {
                // 2. Send message to the backend API
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ session_id: sessionId, user_message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // 3. Display robot response
                // Assuming the API returns a 'response' field
                const robotResponse = data.response || "[Error: No response field found in API data.]";
                appendMessage('robot', robotResponse);

            } catch (error) {
                console.error('Error sending message:', error);
                appendMessage('robot', `[Connection Error]: Could not reach the server. ${error.message}`);
            } finally {
                sendButton.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initial welcome message
        appendMessage('robot', 'Hello! I am RobotGirl. How can I assist you today?');
    </script>
</body>
</html>
